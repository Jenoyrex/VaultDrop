name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so new CodeQL queries run against unchanged code too.
  schedule:
    - cron: "17 4 * * 1"

# Least-privilege default: nothing in this workflow writes to the repo.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # The only extra permission any job here gets: uploading results to the
    # repository's code-scanning alerts. `actions: read` is needed by CodeQL
    # to read workflow run metadata on private repositories.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      # JavaScript/TypeScript needs no build step: CodeQL extracts the
      # source directly ("build-mode: none").
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
