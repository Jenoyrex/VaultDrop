version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultdrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultdrop
      POSTGRES_PASSWORD: vaultdrop
      POSTGRES_DB: vaultdrop
    ports:
      - "5432:5432"
    volumes:
      - vaultdrop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultdrop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaultdrop-postgres-data:
